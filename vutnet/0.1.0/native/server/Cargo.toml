[package]
name = "vutnet-server-native"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Internal HTTP server engine for Vutnet, built on Tokio and Hyper."

[lib]
name = "vutnet_server_native"
crate-type = ["rlib", "staticlib"]

[dependencies]
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "sync",
    "time",
    "signal",
    "macros",
    "io-util",
    "fs",
] }
tokio-util = { version = "0.7", features = ["io"] }

[lints.rust]
# The FFI module needs the `unsafe(no_mangle)` attribute for its C export and
# explicitly allows that single lint; everywhere else unsafe stays denied.
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
